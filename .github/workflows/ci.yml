name: Deterministic verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ops-assistant
    env:
      OPS_MODEL: ''
      OPS_API_KEY: ''
      OPS_EMBEDDING_MODEL: ''
      LANGSMITH_TRACING: 'false'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.12.23'
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: ops-assistant/uv.lock
      - run: uv sync --locked
      - run: uv run python scripts/bootstrap.py
      - run: uv run python -m compileall -q src scripts tests eval ../教程/实验
      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: uv run python eval/run_eval.py --verbose
      - run: uv run python scripts/verify_recovery.py
      - run: uv run python ../教程/实验/23_framework_contracts.py
      - run: uv run python ../教程/实验/23_agent_budget.py
      - if: runner.os == 'Linux'
        run: uv run python scripts/verify_ui.py
