[project]
name = "ops-assistant"
version = "0.1.0"
description = "经营数据分析与知识库智能助手：SQLite 经营数据 + 本地知识库 + LangGraph 工作流 + 人工审批（演示项目）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # 版本基线来自 工程规格.md 1.1（2026-10-19 PyPI 元数据核对），按规格锁定
    "langchain==1.4.6",
    "langgraph==1.2.16",
    "langchain-openai==1.7.2",
    "langchain-text-splitters==1.1.3",
    "langgraph-checkpoint-sqlite==3.1.2",
    # 以下按规格范围安装，具体补丁版本由仓库提交的 uv.lock 固定
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "streamlit>=1.40,<2",
    "pydantic>=2.8,<3",
    "python-dotenv>=1.0,<2",
    "httpx>=0.27,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# src 布局：只打包 src/ops_assistant 这一个顶级包
packages = ["src/ops_assistant"]

[tool.pytest.ini_options]
# 让测试无需先安装即可 import ops_assistant（与 uv sync 的可编辑安装互为兜底）
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
# 行宽按"显示宽度"计：中文注释/文档每个汉字占 2 列，100 列只能放约 50 个汉字，
# 对本项目的中文 docstring 过紧；120 列（约 60 汉字）与主流 CJK 项目一致。
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
